<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phishing URL Checker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4">
            <h2 class="text-center">🔍 Phishing URL Checker</h2>
            
            <form id="urlForm">
                <div class="mb-3">
                    <label class="form-label">Enter URL:</label>
                    <input type="text" id="urlInput" name="url" class="form-control" required placeholder="https://example.com">
                </div>
                <button type="submit" class="btn btn-primary w-100">Check URL</button>
            </form>

            <div id="resultContainer" class="mt-4" style="display: none;">
                <div class="alert" id="result"></div>
                <h4 class="mt-3">🔍 Accuracy & Analysis</h4>
                <ul id="analysisDetails" class="list-group"></ul>
            </div>
        </div>
    </div>

    <script>
        document.getElementById("urlForm").addEventListener("submit", async function(event) {
            event.preventDefault();
            
            let url = document.getElementById("urlInput").value;
            let resultContainer = document.getElementById("resultContainer");
            let resultElement = document.getElementById("result");
            let analysisDetails = document.getElementById("analysisDetails");

            resultContainer.style.display = "none"; 
            resultElement.innerHTML = "🔍 Processing...";
            resultElement.className = "alert alert-info";

            try {
                let response = await fetch("http://127.0.0.1:5000/check_url/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: url })
                });

                let data = await response.json();
                resultContainer.style.display = "block";

                // ✅ แสดงผลลัพธ์ Safe หรือ Unsafe
                resultElement.innerHTML = `🔍 URL: ${data.url} → <strong>${data.result}</strong>`;
                resultElement.className = data.result === "unsafe" ? "alert alert-danger" : "alert alert-success";

                // ✅ แสดงเหตุผลและตัวแปรที่ใช้
                analysisDetails.innerHTML = "";
                for (let key in data.details) {
                    let listItem = document.createElement("li");
                    listItem.className = "list-group-item";
                    listItem.innerHTML = `<strong>${key}:</strong> ${data.details[key]}`;
                    analysisDetails.appendChild(listItem);
                }

            } catch (error) {
                resultElement.innerHTML = "❌ Error checking URL";
                resultElement.className = "alert alert-warning";
            }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
